# Space Debris Risk Prediction - Unified Docker Compose
# Single file containing all services
#
# Architecture:
#   - Kafka + Zookeeper: Message broker
#   - HDFS (NameNode + DataNode): Distributed storage
#   - Spark (Master + Workers): Processing engine
#   - Spark Job 1: SGP4 Streaming (Kafka → HDFS)
#   - Spark Job 2: Collision Prediction (HDFS → HDFS/Kafka)
#   - Airflow: Data ingestion orchestration (API → Kafka)
#   - TLE API: Source data API
#   - Dashboard: Web UI + API
#
# Usage: docker-compose up -d

services:
  # ==========================================
  # ZOOKEEPER (Required for Kafka)
  # ==========================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    hostname: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_MAX_CLIENT_CNXNS: 0
      TZ: 'Asia/Kolkata'
    networks:
      - bigdata-net
    healthcheck:
      test: echo ruok | nc localhost 2181 || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==========================================
  # KAFKA BROKER
  # ==========================================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    hostname: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9093,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_DELETE_TOPIC_ENABLE: 'true'
      TZ: 'Asia/Kolkata'
    networks:
      - bigdata-net
    healthcheck:
      test: kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # ==========================================
  # KAFKA UI (Web Interface)
  # ==========================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    hostname: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: space-debris-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9093
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      TZ: 'Asia/Kolkata'
    networks:
      - bigdata-net
    restart: unless-stopped

  # ==========================================
  # HDFS NAMENODE
  # ==========================================
  namenode:
    image: apache/hadoop:3.3.6
    container_name: namenode
    hostname: namenode
    ports:
      - "9870:9870"
      - "9000:9000"
    environment:
      ENSURE_NAMENODE_DIR: "/tmp/hadoop-root/dfs/name"
      CLUSTER_NAME: "space-debris-cluster"
      TZ: 'Asia/Kolkata'
    command: ["hdfs", "namenode"]
    volumes:
      - namenode-data:/hadoop/dfs/name
      - ./config/hadoop:/opt/hadoop/etc/hadoop
    networks:
      - bigdata-net
    healthcheck:
      test: curl -f http://localhost:9870/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ==========================================
  # HDFS DATANODE
  # ==========================================
  datanode:
    image: apache/hadoop:3.3.6
    container_name: datanode
    hostname: datanode
    depends_on:
      namenode:
        condition: service_healthy
    ports:
      - "9864:9864"
      - "9866:9866"
    environment:
      NAMENODE_HOSTNAME: "namenode"
      TZ: 'Asia/Kolkata'
    command: ["hdfs", "datanode"]
    volumes:
      - datanode-data:/hadoop/dfs/data
      - ./config/hadoop:/opt/hadoop/etc/hadoop
    networks:
      - bigdata-net
    restart: unless-stopped

  # ==========================================
  # SPARK MASTER
  # ==========================================
  spark-master:
    build:
      context: ./config/docker
      dockerfile: Dockerfile.spark
    image: spark-sgp4:3.5.0
    container_name: spark-master
    hostname: spark-master
    user: root
    ports:
      - "8080:8080"
      - "7077:7077"
      - "4040:4040"
      - "6066:6066"
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_HOST=spark-master
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080
      - SPARK_REST_PORT=6066
      - TZ=Asia/Kolkata
    volumes:
      - ./pipelines:/opt/spark-apps
      - ./data:/opt/spark-data
      - ./config/docker/spark_rest_trigger.py:/opt/spark_rest_trigger.py
    command: |
      bash -c "/opt/spark/sbin/start-master.sh && sleep 5 && python3 /opt/spark_rest_trigger.py & sleep infinity"
    networks:
      - bigdata-net
    restart: unless-stopped

  # ==========================================
  # SPARK WORKER 1
  # ==========================================
  spark-worker-1:
    build:
      context: ./config/docker
      dockerfile: Dockerfile.spark
    image: spark-sgp4:3.5.0
    container_name: spark-worker-1
    hostname: spark-worker-1
    user: root
    depends_on:
      - spark-master
    ports:
      - "8081:8081"
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_WEBUI_PORT=8081
      - TZ=Asia/Kolkata
    volumes:
      - ./pipelines:/opt/spark-apps
      - ./data:/opt/spark-data
    command: |
      bash -c "sleep 5 && /opt/spark/sbin/start-worker.sh spark://spark-master:7077 && tail -f /opt/spark/logs/*"
    networks:
      - bigdata-net
    restart: unless-stopped

  # ==========================================
  # SPARK WORKER 2
  # ==========================================
  spark-worker-2:
    build:
      context: ./config/docker
      dockerfile: Dockerfile.spark
    image: spark-sgp4:3.5.0
    container_name: spark-worker-2
    hostname: spark-worker-2
    user: root
    depends_on:
      - spark-master
    ports:
      - "8083:8083"
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_WEBUI_PORT=8083
      - TZ=Asia/Kolkata
    volumes:
      - ./pipelines:/opt/spark-apps
      - ./data:/opt/spark-data
    command: |
      bash -c "sleep 5 && /opt/spark/sbin/start-worker.sh spark://spark-master:7077 && tail -f /opt/spark/logs/*"
    networks:
      - bigdata-net
    restart: unless-stopped

  # ==========================================
  # SPARK JOB 1: SGP4 STREAMING
  # ==========================================
  # Consumes TLE from Kafka, computes SGP4 vectors, writes to HDFS
  spark-sgp4-streaming:
    build:
      context: ./config/docker
      dockerfile: Dockerfile.spark
    image: spark-sgp4:3.5.0
    container_name: spark-sgp4-streaming
    hostname: spark-sgp4-streaming
    user: root
    depends_on:
      - spark-master
      - kafka
      - namenode
      - postgres-debris
    environment:
      - SPARK_MODE=client
      - SPARK_MASTER_URL=spark://spark-master:7077
      - KAFKA_SERVERS=kafka:9093
      - KAFKA_TOPIC=space_debris_tle
      - HDFS_OUTPUT=hdfs://namenode:9000/space-debris/sgp4_vectors
      - CHECKPOINT_PATH=hdfs://namenode:9000/tmp/spark-checkpoint-sgp4
      - MIN_ALTITUDE_KM=150.0
      - MAX_TLE_AGE_DAYS=36500
      - POSTGRES_HOST=postgres-debris
      - POSTGRES_PORT=5432
      - POSTGRES_DB=space_debris
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - TZ=Asia/Kolkata
    volumes:
      - ./pipelines:/opt/spark-apps
      - ./data:/opt/spark-data
      - ./scripts:/opt/scripts
    networks:
      - bigdata-net
    command: ["/bin/bash", "/opt/scripts/spark_sgp4_streaming.sh"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pgrep", "-f", "spark"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================
  # SPARK JOB 2: COLLISION PREDICTION
  # ==========================================
  # Reads SGP4 vectors from HDFS, predicts collisions, writes to HDFS/Kafka
  spark-collision-prediction:
    build:
      context: ./config/docker
      dockerfile: Dockerfile.spark
    image: spark-sgp4:3.5.0
    container_name: spark-collision-prediction
    hostname: spark-collision-prediction
    user: root
    depends_on:
      - spark-master
      - namenode
      - kafka
      - postgres-debris
    environment:
      - SPARK_MODE=client
      - SPARK_MASTER_URL=spark://spark-master:7077
      - PREDICTION_DAYS=7
      - COLLISION_THRESHOLD_KM=10.0
      - TIME_WINDOW_DAYS=7
      - SGP4_PROPAGATION_STEP_HOURS=6
      - HDFS_SGP4_VECTORS_PATH=hdfs://namenode:9000/space-debris/sgp4_vectors
      - HDFS_COLLISION_PREDICTIONS_PATH=hdfs://namenode:9000/space-debris/collision_predictions
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9093
      - KAFKA_COLLISION_TOPIC=space_debris_collisions
      - POSTGRES_HOST=postgres-debris
      - POSTGRES_PORT=5432
      - POSTGRES_DB=space_debris
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - TZ=Asia/Kolkata
    volumes:
      - ./pipelines:/opt/spark-apps
      - ./data:/opt/spark-data
      - ./scripts:/opt/scripts
    networks:
      - bigdata-net
    command: ["/bin/bash", "/opt/scripts/spark_collision_prediction.sh"]
    restart: unless-stopped

  # ==========================================
  # TLE API (Flask Streaming API)
  # ==========================================
  tle-api:
    image: python:3.11-slim
    container_name: tle-api
    hostname: tle-api
    ports:
      - "5000:5000"
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      FLASK_APP: api.py
      FLASK_ENV: development
      PYTHONUNBUFFERED: 1
      TZ: 'Asia/Kolkata'
    command: >
      bash -c "apt-get update && apt-get install -y curl &&
               pip install --no-cache-dir -r requirements-api.txt &&
               python api.py"
    networks:
      - bigdata-net
    dns:
      - 8.8.8.8
      - 8.8.4.4
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 40s

  # ==========================================
  # POSTGRES (Airflow Metadata)
  # ==========================================
  postgres:
    image: postgres:14-alpine
    container_name: airflow-postgres
    hostname: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
      TZ: 'Asia/Kolkata'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - bigdata-net
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==========================================
  # POSTGRES (Space Debris Data)
  # ==========================================
  postgres-debris:
    image: postgres:14-alpine
    container_name: postgres-debris
    hostname: postgres-debris
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: space_debris
      TZ: 'Asia/Kolkata'
    volumes:
      - postgres-debris-data:/var/lib/postgresql/data
      - ./config/postgres/init_schema.sql:/docker-entrypoint-initdb.d/init_schema.sql
    networks:
      - bigdata-net
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "space_debris"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==========================================
  # AIRFLOW INIT (One-time setup)
  # ==========================================
  airflow-init:
    image: apache/airflow:2.8.1-python3.11
    container_name: airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__FERNET_KEY: 'FB0o_zt4e3Ziq3LdUUO7F2Z95cvFFx16hU8jTeR1ASM='
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
      _PIP_ADDITIONAL_REQUIREMENTS: 'kafka-python==2.0.2 requests==2.31.0'
      TZ: 'Asia/Kolkata'
    networks:
      - bigdata-net
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true
    restart: "no"

  # ==========================================
  # AIRFLOW WEBSERVER
  # ==========================================
  airflow-webserver:
    image: apache/airflow:2.8.1-python3.11
    container_name: airflow-webserver
    hostname: airflow-webserver
    user: "50000:0"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      tle-api:
        condition: service_healthy
    ports:
      - "8088:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__FERNET_KEY: 'FB0o_zt4e3Ziq3LdUUO7F2Z95cvFFx16hU8jTeR1ASM='
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DEFAULT_TIMEZONE: 'Asia/Kolkata'
      AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: 'Asia/Kolkata'
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
      AIRFLOW__WEBSERVER__SECRET_KEY: 'airflow_secret_key_space_debris_2026'
      _PIP_ADDITIONAL_REQUIREMENTS: 'kafka-python==2.0.2 requests==2.31.0 apache-airflow-providers-apache-spark==4.5.0'
      TZ: 'Asia/Kolkata'
    volumes:
      - ./pipelines/ingestion:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./config/airflow:/opt/airflow/config
      - ./pipelines:/opt/spark-apps:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - bigdata-net
    dns:
      - 8.8.8.8
      - 8.8.4.4
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ==========================================
  # AIRFLOW SCHEDULER
  # ==========================================
  airflow-scheduler:
    image: apache/airflow:2.8.1-python3.11
    container_name: airflow-scheduler
    hostname: airflow-scheduler
    user: "50000:960"
    group_add:
      - "960"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      tle-api:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__FERNET_KEY: 'FB0o_zt4e3Ziq3LdUUO7F2Z95cvFFx16hU8jTeR1ASM='
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DEFAULT_TIMEZONE: 'Asia/Kolkata'
      _PIP_ADDITIONAL_REQUIREMENTS: 'kafka-python==2.0.2 requests==2.31.0 apache-airflow-providers-apache-spark==4.5.0'
      TZ: 'Asia/Kolkata'
    volumes:
      - ./pipelines/ingestion:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./config/airflow:/opt/airflow/config
      - ./pipelines:/opt/spark-apps:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - bigdata-net
    dns:
      - 8.8.8.8
      - 8.8.4.4
    command: scheduler
    restart: unless-stopped

  # ==========================================
  # DASHBOARD API (Collision Data Service)
  # ==========================================
  dashboard-api:
    build:
      context: ./config/docker
      dockerfile: Dockerfile.spark
    image: spark-sgp4:3.5.0
    container_name: dashboard-api
    hostname: dashboard-api
    user: root
    depends_on:
      - namenode
      - spark-master
      - postgres-debris
    ports:
      - "5001:5001"
    environment:
      - PREDICTION_DAYS=7
      - COLLISION_THRESHOLD_KM=10.0
      - TIME_WINDOW_DAYS=7
      - SGP4_PROPAGATION_STEP_HOURS=6
      - HDFS_SGP4_VECTORS_PATH=hdfs://namenode:9000/space-debris/sgp4_vectors
      - HDFS_COLLISION_PREDICTIONS_PATH=hdfs://namenode:9000/space-debris/collision_predictions
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9093
      - KAFKA_COLLISION_TOPIC=space_debris_collisions
      - DASHBOARD_PORT=5001
      - HIGH_RISK_THRESHOLD_KM=5.0
      - MEDIUM_RISK_THRESHOLD_KM=10.0
      - LOW_RISK_THRESHOLD_KM=50.0
      - POSTGRES_HOST=postgres-debris
      - POSTGRES_PORT=5432
      - POSTGRES_DB=space_debris
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - TZ=Asia/Kolkata
    volumes:
      - ./dashboard_api_postgres.py:/opt/spark-apps/dashboard_api.py
      - ./requirements-dashboard.txt:/opt/spark-apps/requirements-dashboard.txt
      - ./pipelines:/opt/spark-apps/pipelines:ro
    networks:
      - bigdata-net
    command: >
      bash -c "
        pip3 install -r /opt/spark-apps/requirements-dashboard.txt &&
        python3 /opt/spark-apps/dashboard_api.py
      "
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================
  # WEB DASHBOARD (Frontend)
  # ==========================================
  dashboard-web:
    image: nginx:alpine
    container_name: dashboard-web
    hostname: dashboard-web
    depends_on:
      - dashboard-api
    ports:
      - "8082:80"
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
    networks:
      - bigdata-net
    restart: unless-stopped

networks:
  bigdata-net:
    driver: bridge
    name: bigdata-net

volumes:
  namenode-data:
    name: namenode-data
  datanode-data:
    name: datanode-data
  postgres-data:
    name: postgres-data
  postgres-debris-data:
    name: postgres-debris-data

